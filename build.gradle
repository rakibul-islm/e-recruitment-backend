plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.13'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bd'
version = '0.0.1-SNAPSHOT'

ext['tomcat.version'] = '10.1.59' // CVE-2026-65182/65905/68525 fix (10.1.58 withdrawn from Maven Central); Spring Boot 3.3.x's own managed version (10.1.42) predates these

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// JWT 0.12.x — split into API + impl + jackson provider
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.5.0'
	implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.1'

	// HTML -> PDF rendering for generated candidate CVs (CvGenerationService)
	implementation group: 'com.openhtmltopdf', name: 'openhtmltopdf-pdfbox', version: '1.0.10'
	implementation group: 'com.oracle.ojdbc', name: 'ojdbc8', version: '19.3.0.0'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Required placeholders (application.yml) have no defaults; supply dummy
	// values so the Spring context loads in CI without real secrets.
	environment "MAIL_FROM", "test@example.com"
	environment "GMAIL_CLIENT_ID", "test-client-id"
	environment "GMAIL_CLIENT_SECRET", "test-client-secret"
	environment "GMAIL_REFRESH_TOKEN", "test-refresh-token"
	environment "GOOGLE_CLIENT_ID", "test-google-client-id"
	environment "FRONTEND_BASE_URL", "http://localhost:4200"
}
