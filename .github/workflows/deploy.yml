name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # Initialize
  # ============================================================
  initialize:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - name: Compute image metadata
        id: vars
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          # Use full Git commit SHA as immutable Docker tag
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          echo "Docker image: $IMAGE"
          echo "Image tag: ${GITHUB_SHA}"


  # ============================================================
  # Test
  # ============================================================
  test:
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test
          retention-days: 5


  # ============================================================
  # Build Docker Image
  # ============================================================
  build:
    needs: [initialize, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true

          # Temporary local tag
          tags: ${{ needs.initialize.outputs.image }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------
      # Security Scan
      # ----------------------------------------------------------
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.initialize.outputs.image }}:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ----------------------------------------------------------
      # Save Docker Image
      # ----------------------------------------------------------
      - name: Save image as artifact
        run: |
          docker save \
            "${{ needs.initialize.outputs.image }}:latest" \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1


  # ============================================================
  # Push Image to GitHub Container Registry
  # ============================================================
  push:
    needs: [initialize, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Tag and Push
      # ----------------------------------------------------------
      - name: Tag and push Docker images
        run: |
          IMAGE="${{ needs.initialize.outputs.image }}"
          SHA_TAG="${{ needs.initialize.outputs.sha_tag }}"

          echo "Image: $IMAGE"
          echo "SHA tag: $SHA_TAG"

          # Tag immutable commit image
          docker tag \
            "$IMAGE:latest" \
            "$IMAGE:$SHA_TAG"

          # Push latest
          docker push "$IMAGE:latest"

          # Push immutable SHA tag
          docker push "$IMAGE:$SHA_TAG"

          echo "Successfully pushed:"
          echo "$IMAGE:latest"
          echo "$IMAGE:$SHA_TAG"


  # ============================================================
  # Deploy to Render
  # ============================================================
  deploy:
    needs: [initialize, push]
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Deploy EXACT SHA image to Render
      # ----------------------------------------------------------
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.initialize.outputs.image }}
          SHA_TAG: ${{ needs.initialize.outputs.sha_tag }}
        run: |
          FULL_IMAGE="${IMAGE}:${SHA_TAG}"

          echo "======================================"
          echo "Deploying image:"
          echo "$FULL_IMAGE"
          echo "======================================"

          # URL encode the Docker image
          ENCODED_IMAGE=$(printf '%s' "$FULL_IMAGE" | jq -sRr @uri)

          # Render deploy hook already contains ?key=...
          DEPLOY_URL="${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENCODED_IMAGE}"

          echo "Triggering Render deployment..."

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "$DEPLOY_URL"

          echo
          echo "Render deployment triggered successfully."


      # ----------------------------------------------------------
      # Wait for application health
      # ----------------------------------------------------------
      - name: Wait for service to become healthy
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          echo "Waiting for service to become healthy..."

          for i in $(seq 1 30); do

            echo "Health check attempt $i/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              "$HEALTHCHECK_URL" > /dev/null; then

              echo "======================================"
              echo "Service is healthy!"
              echo "======================================"

              exit 0
            fi

            echo "Service is not ready yet."
            echo "Waiting 15 seconds..."

            sleep 15
          done

          echo "======================================"
          echo "ERROR: Service did not become healthy"
          echo "within the expected time."
          echo "======================================"

          exit 1