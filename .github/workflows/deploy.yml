name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Compute image metadata
        id: vars
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  test:
    needs: initialize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test
          retention-days: 5

  build:
    needs: [initialize, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.initialize.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.initialize.outputs.image }}:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Save image as artifact
        run: docker save "${{ needs.initialize.outputs.image }}:latest" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  push:
    needs: [initialize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag "${{ needs.initialize.outputs.image }}:latest" "${{ needs.initialize.outputs.image }}:${{ needs.initialize.outputs.sha_tag }}"
          docker push "${{ needs.initialize.outputs.image }}:latest"
          docker push "${{ needs.initialize.outputs.image }}:${{ needs.initialize.outputs.sha_tag }}"

  deploy:
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for service to become healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ secrets.HEALTHCHECK_URL }}" > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 15s..."
            sleep 15
          done
          echo "Service did not become healthy in time"
          exit 1
