server:
  servlet:
    context-path: /e-recruitment
  port: ${PORT:8041}

spring:
  application:
    name: e-recruitment
  profiles:
    active: dev
    group:
      dev: h2
      prod: postgres
  jackson:
    serialization:
      fail-on-empty-beans: false
      indent-output: true
    time-zone: UTC
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        id:
          optimizer:
            pooled:
              preferred: none
          sequence:
            increment_size_mismatch_strategy: fix
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 120MB
      enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha

google:
  client-id: ${GOOGLE_CLIENT_ID}

app:
  mail:
    from: ${MAIL_FROM}
    gmail:
      client-id: ${GMAIL_CLIENT_ID}
      client-secret: ${GMAIL_CLIENT_SECRET}
      refresh-token: ${GMAIL_REFRESH_TOKEN}
  otp:
    expiry-minutes: 10
    max-attempts: 5
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  account-setup:
    expiry-hours: 48
